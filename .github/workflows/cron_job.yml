name: Get Top PT Stream Services

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 0,8,12,17 * * *'

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    outputs:
      access_token: ${{ steps.refresh.outputs.access_token }}

    steps:
      - name: Refresh Trakt Token
        id: refresh
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          response=$(curl -sS --fail --location 'https://api.trakt.tv/oauth/token' \
            --header 'Content-Type: application/json' \
            --data '{
                "refresh_token": "'"$REFRESH_TOKEN"'",
                "client_id": "'"$CLIENT_ID"'",
                "client_secret": "'"$CLIENT_SECRET"'",
                "redirect_uri": "urn:ietf:wg:oauth:2.0:oob",
                "grant_type": "refresh_token"
            }')

          access_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$response")
          refresh_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["refresh_token"])' <<< "$response")

          echo "::add-mask::$access_token"
          echo "::add-mask::$refresh_token"

          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

          gh secret set ACCESS_TOKEN -b"$access_token"
          gh secret set REFRESH_TOKEN -b"$refresh_token"

  scrape:
    needs: refresh-token
    runs-on: [self-hosted, linux, x64, peakplay-macmini]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run code quality checks
        run: |
          .venv/bin/black --check --line-length 120 --target-version py312 top_pt_stream_services.py
          .venv/bin/flake8 top_pt_stream_services.py --max-line-length=120
          .venv/bin/bandit -r top_pt_stream_services.py

      - name: Run Python Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ACCESS_TOKEN: ${{ needs.refresh-token.outputs.access_token }}
          KIDS_LIST: ${{ vars.KIDS_LIST }}
          PRINT_LISTS: ${{ vars.PRINT_LISTS }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: .venv/bin/python top_pt_stream_services.py
