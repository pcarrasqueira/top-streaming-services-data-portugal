name: Refresh Trakt Token and Dispatch Sync

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 0,8,12,17 * * *'

concurrency:
  group: refresh-trakt-token
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  refresh-token:
    runs-on: ubuntu-latest

    steps:
      - name: Refresh Trakt Token
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          test -n "$REFRESH_TOKEN" || (echo "REFRESH_TOKEN is empty" && exit 1)
          test -n "$CLIENT_ID" || (echo "CLIENT_ID is empty" && exit 1)
          test -n "$GH_TOKEN" || (echo "GH_PAT is empty" && exit 1)

          set +e
          response=$(curl -sS --fail-with-body --location 'https://api.trakt.tv/oauth/token' \
            --header 'Content-Type: application/json' \
            --header "trakt-api-key: $CLIENT_ID" \
            --header 'trakt-api-version: 2' \
            --data '{
                "refresh_token": "'"$REFRESH_TOKEN"'",
                "client_id": "'"$CLIENT_ID"'",
                "grant_type": "refresh_token"
            }' \
            --write-out '\n__HTTP_STATUS__:%{http_code}')
          curl_exit=$?
          set -e

          http_status="${response##*$'\n__HTTP_STATUS__:'}"
          response_body="${response%$'\n__HTTP_STATUS__:'*}"

          if [ "$curl_exit" -ne 0 ]; then
            error_details=$(printf '%s' "$response_body" | \
              python3 -c 'import json,sys; data=json.load(sys.stdin); print((data.get("error") or "unknown_error") + ": " + (data.get("error_description") or "no description"))' 2>/dev/null || \
              echo "unparseable error response")
            echo "Trakt token refresh failed (HTTP ${http_status:-unknown}): $error_details"
            exit "$curl_exit"
          fi

          response="$response_body"

          access_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$response")
          refresh_token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["refresh_token"])' <<< "$response")

          echo "::add-mask::$access_token"
          echo "::add-mask::$refresh_token"

          gh secret set ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" -b"$access_token"
          gh secret set REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" -b"$refresh_token"

      - name: Dispatch Trakt sync workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run scrape_top_stream_services.yml --repo "$GITHUB_REPOSITORY"
