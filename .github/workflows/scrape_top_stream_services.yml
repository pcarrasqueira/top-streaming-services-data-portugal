name: Sync Trakt Lists from PeakPlay

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run code quality checks
        run: |
          .venv/bin/black --check --line-length 120 --target-version py312 top_pt_stream_services.py
          .venv/bin/flake8 top_pt_stream_services.py --max-line-length=120
          .venv/bin/bandit -r top_pt_stream_services.py

      - name: Check Trakt credentials
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          test -n "$CLIENT_ID" && echo "CLIENT_ID is set" || (echo "CLIENT_ID is empty" && exit 1)
          test -n "$ACCESS_TOKEN" && echo "ACCESS_TOKEN is set" || (echo "ACCESS_TOKEN is empty" && exit 1)

      - name: Check Supabase credentials
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && echo "SUPABASE_URL is set" || (echo "SUPABASE_URL is empty" && exit 1)
          test -n "$SUPABASE_API_KEY" && echo "Supabase API key is set" || (echo "Supabase API key is empty" && exit 1)

      - name: Load PeakPlay Rankings and Sync Trakt Lists
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          KIDS_LIST: ${{ vars.KIDS_LIST }}
          PRINT_LISTS: ${{ vars.PRINT_LISTS }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_COUNTRY_CODE: ${{ vars.SUPABASE_COUNTRY_CODE }}
        run: .venv/bin/python top_pt_stream_services.py
